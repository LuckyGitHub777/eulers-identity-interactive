name: Verify Euler interactive learning
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout source without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact released file hashes
        run: sha256sum --check --strict MANIFEST.sha256
      - name: Exercise offline learning contract
        run: python -m unittest discover -s tests -v
      - name: Parse offline JavaScript
        run: |
          node --check app.js
          node --check matrix.js
          node --check phase.js
          node --check modules/unit-circle.js
          node --check modules/matrix-rotation.js
          node --check modules/phasor.js
